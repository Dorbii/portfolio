<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaizen Metrics motion review</title>
    <style>
      html, body { height: 100%; margin: 0; background: #02050a; }
      body { display: grid; place-items: center; }
      video { width: min(100vw, 1280px); max-height: 100vh; object-fit: contain; }
    </style>
  </head>
  <body>
    <video autoplay controls muted loop preload="auto" src="/projects/kaizen-metrics/v11-review-preview.mp4"></video>
    <script>
      const video = document.querySelector('video');
      const start = Number.parseFloat(new URLSearchParams(location.search).get('t') || '0');
      video.addEventListener('loadedmetadata', () => {
        if (Number.isFinite(start)) video.currentTime = Math.min(Math.max(start, 0), video.duration);
      }, { once: true });
    </script>
  </body>
</html>
