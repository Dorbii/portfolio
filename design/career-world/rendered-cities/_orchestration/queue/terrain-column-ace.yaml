acceptance_criteria:
  - View each matching territory PNG before generation and use only that PNG as its composition reference.
  - Produce exactly one Column Technologies environment plate and one ACE Hardware environment plate, using separate imagegen calls.
  - Column preserves a rectilinear engineered breakwater, straight seawalls, protected basins, long structural terraces, formal circulation, and clear placement zones.
  - ACE preserves a compact low island, east working cove, repair apron, modest central rise, branching lanes, and clear placement zones.
  - Both plates use exact orthographic 2.5D isometric perspective, neutral grayscale, dark water/background, restrained technical linework, and consistent upper-left lighting.
  - Remove all labels, node diamonds, icons, landmark buildings, logos, text, people, and vehicles.
expected_exit_gate: Both PNGs exist and report records prompts, dimensions, and visual self-checks.
gate_commands:
  - Test-Path design/career-world/rendered-cities/environment-plates/column-technologies-environment-r1.png
  - Test-Path design/career-world/rendered-cities/environment-plates/ace-hardware-environment-r1.png
stop_conditions:
  - One directed generation per territory only; no concept tournament or alternates.
  - Stop and report any plate whose reference cannot be loaded or whose output cannot be saved.
