acceptance_criteria:
  - View each matching territory PNG before generation and use only that PNG as its composition reference.
  - Produce exactly one Tanium environment plate and one Independent environment plate, using separate imagegen calls.
  - Tanium preserves the long diagonal inspection ridge, stepped terraces, sequential passes, southeast channel, hard quay, and clear placement zones.
  - Independent preserves the asymmetric maker peninsula, triangular review cut, diagonal promenade, rocky workshop character, and clear placement zones.
  - Both plates use exact orthographic 2.5D isometric perspective, neutral grayscale, dark water/background, restrained technical linework, and consistent upper-left lighting.
  - Remove all labels, node diamonds, icons, landmark buildings, logos, text, people, and vehicles.
expected_exit_gate: Both PNGs exist and report records prompts, dimensions, and visual self-checks.
gate_commands:
  - Test-Path design/career-world/rendered-cities/environment-plates/tanium-environment-r1.png
  - Test-Path design/career-world/rendered-cities/environment-plates/independent-environment-r1.png
stop_conditions:
  - One directed generation per territory only; no concept tournament or alternates.
  - Stop and report any plate whose reference cannot be loaded or whose output cannot be saved.
