concept: Broad asymmetric continent organized around a large open river basin, with mountain ranges pushed toward the northern and western edges. Three distant lowland regions form a wide triangle. Add one rugged unoccupied island, one long low harbor island, and one compact low cove island.
acceptance_criteria:
  - Exactly one connected main continent and exactly three detached islands.
  - One island is rugged and intentionally unoccupied; two have at least 65 percent broad low terrain suitable for sprawling cities.
  - Main continent visibly supports three widely separated future capital regions with expansion room.
  - Include connected mountain-fed rivers, a lake or wetland, deltas, varied coasts, broad plains, and distinct elevation bands.
  - Orthographic 2.5D isometric monochrome technical-realism terrain, full map visible with ocean margin.
  - No cities, buildings, roads, pads, docks, vehicles, labels, text, UI, logo, grid, or watermark.
expected_exit_gate: One inspected PNG saved at the allowed path and a JSON report recording the exact prompt, dimensions, and constraint checks.
